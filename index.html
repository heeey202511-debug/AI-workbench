<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI 工作台">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-ai.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-ai.png">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#fff9f5">

<title>运营工作台</title>
<style>

  :root {
    --bg: #fff9f5;
    --bg-soft: #fff0e8;
    --bg-pink: #fff5f7;
    --card: #ffffff;
    --border: #f3e5dc;
    --border-soft: #f9ede6;
    --text: #2e2a28;
    --text-soft: #6b6260;
    --text-dim: #a89e9b;
    --primary: #e88a6a;
    --primary-dark: #d47252;
    --primary-soft: rgba(232, 138, 106, 0.12);
    --primary-hover: rgba(232, 138, 106, 0.22);
    --success: #6fb98f;
    --success-soft: rgba(111, 185, 143, 0.12);
    --warning: #e6a23c;
    --warning-soft: rgba(230, 162, 60, 0.12);
    --danger: #e56b7e;
    --danger-soft: rgba(229, 107, 126, 0.12);
    --purple: #a78bfa;
    --purple-soft: rgba(167, 139, 250, 0.12);
    --cyan: #5ab8c4;
    --cyan-soft: rgba(90, 184, 196, 0.12);
    --pink: #f48fb1;
    --pink-soft: rgba(244, 143, 177, 0.12);
    --orange: #f4a261;
    --orange-soft: rgba(244, 162, 97, 0.12);
    --cream: #fff8e7;
    --cream-soft: #fff5dd;
    --radius: 24px;
    --radius-sm: 16px;
    --shadow-sm: 0 2px 6px rgba(46,42,40,0.04);
    --shadow: 0 8px 24px rgba(46,42,40,0.07), 0 2px 6px rgba(46,42,40,0.03);
    --shadow-lg: 0 16px 48px rgba(46,42,40,0.11), 0 4px 12px rgba(46,42,40,0.04);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --nav-w: 110px;
    --nav-w-open: 260px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* 小猫 sprite：原图 1440x1920 按 3x4 切分 */

  .cat-paw { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50% 50% 45% 45%; background: var(--primary-soft); color: var(--primary); font-size: 10px; }

  .drawer { position: fixed; top: 0; left: 0; bottom: 0; z-index: 80; width: var(--nav-w); background: var(--card); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; padding: calc(14px + var(--safe-top)) 0 calc(14px + var(--safe-bottom)); overflow-y: auto; overflow-x: hidden; box-shadow: 2px 0 16px rgba(46,42,40,0.04); }

  .drawer-head { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 10px; margin-bottom: 2px; border-bottom: 1px solid var(--border-soft); }
  .drawer-logo { width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; background: linear-gradient(135deg, var(--primary), var(--pink)); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(232,138,106,0.35); overflow: hidden; font-size: 16px; }
  .drawer-title-wrap { display: flex; flex-direction: column; align-items: center; }

  .drawer-title { font-size: 13px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; }
  .drawer-sub { font-size: 11px; color: var(--text-dim); white-space: nowrap; }

  .nav-list { flex: 1; display: flex; flex-direction: column; gap: 0; padding: 4px 3px; overflow-y: auto; }
  .nav-li { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; border-radius: 12px; text-align: center; position: relative; color: var(--text-soft); cursor: pointer; transition: all 0.15s; font-size: 14px; font-weight: 500; white-space: nowrap; position: relative; }
  .nav-li .ico-wrap { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--bg-soft); transition: all 0.15s; font-size: 18px; margin-bottom: 1px; }
  .nav-li .txt { display: flex; flex-direction: column; align-items: center; }

  .nav-li .lbl { font-size: 11px; font-weight: 600; }
  @media (max-width: 760px) { .nav-li .lbl { font-size: 11px; } }
  .nav-li .desc { display: none; }
  @media (max-width: 760px) { .nav-li .badge { position: absolute; top: 2px; right: 4px; margin: 0; } .drawer-head { padding: 0 8px 10px; } .drawer-title, .drawer-sub { font-size: 0; } .drawer-logo { width: 30px; height: 30px; border-radius: 10px; } }
  .nav-li:hover { background: var(--bg-soft); color: var(--text); }
  .nav-li.active { background: var(--primary-soft); color: var(--primary-dark); }
  .nav-li.active .ico-wrap { background: var(--primary); }
  .nav-li .badge { position: absolute; top: 4px; right: 6px; background: #ef4444; color: white; font-size: 9px; font-weight: 700; min-width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 50%; box-shadow: 0 1px 3px rgba(239,68,68,0.35); z-index: 1; }

  .drawer-foot { padding: 10px 8px; border-top: 1px solid var(--border-soft); }
  .nav-li.tog { font-size: 12px; color: var(--text-dim); padding: 8px 9px; }
  .nav-li.tog .ico-wrap { font-size: 16px; background: transparent; }

  .drawer-mask { display: none; }

  .app { padding-left: var(--nav-w); }
  @media (max-width: 760px) { .app { padding-left: 90px; } .drawer { width: 90px; padding-left: 0; padding-right: 0; } .nav-li .lbl { font-size: 10px; } .nav-li .ico-wrap { width: 32px; height: 32px; font-size: 16px; } }

  .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 12px; padding-top: calc(14px + var(--safe-top)); background: rgba(255,249,245,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid transparent; }
  @media (max-width: 760px) { .topbar { padding: 10px 12px; padding-top: calc(10px + var(--safe-top)); } .topbar-title h1 { font-size: 15px; } .topbar-title p { font-size: 11px; } }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .menu-btn { display: none; width: 40px; height: 40px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); align-items: center; justify-content: center; color: var(--text-soft); cursor: pointer; font-size: 18px; box-shadow: var(--shadow-sm); }
  @media (max-width: 760px) { .menu-btn { display: none; } }
  .menu-btn:active { transform: scale(0.94); }
  .topbar-title h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .topbar-title p { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-soft); cursor: pointer; font-size: 16px; transition: all 0.15s; box-shadow: var(--shadow-sm); }
  .icon-btn:active { transform: scale(0.94); }

  .hero { position: relative; padding: 28px 20px 16px; overflow: hidden; border-radius: 0 0 var(--radius) var(--radius); margin: 0 20px; }
  @media (max-width: 760px) { .hero { margin: 0 12px; padding: 20px 14px 14px; } }
  .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,249,245,0.94) 0%, rgba(255,245,247,0.82) 60%, rgba(255,249,245,0.65) 100%); z-index: 1; }
  .hero-bg { position: absolute; inset: -20px -30px -20px -10px; background-image: url('cat-stickers.jpg'); background-size: cover; background-position: center top; opacity: 0.26; transform: rotate(-2deg); filter: saturate(1.1); z-index: 0; }
  .hero-inner { position: relative; z-index: 2; }
  .hero .greet-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); font-size: 12px; color: var(--primary-dark); font-weight: 600; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
  .hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.15; margin-bottom: 8px; color: var(--text); }
  @media (max-width: 760px) { .hero h1 { font-size: 22px; } .hero .greet { font-size: 13px; } .hero-cat-float { width: 70px; height: 70px; right: -8px; opacity: 0.4; } }
  .hero .greet { font-size: 15px; color: var(--text-soft); max-width: 260px; }
  .hero .date-pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; padding: 8px 16px; border-radius: 24px; background: var(--card); border: 1px solid var(--border-soft); font-size: 13px; color: var(--text-soft); box-shadow: var(--shadow-sm); }
  .hero .date-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .hero-cat-float { position: absolute; right: 8px; bottom: 4px; width: 80px; height: 80px; z-index: 2; opacity: 0.55; filter: drop-shadow(0 4px 8px rgba(46,42,40,0.06)); }
  @media (max-width: 380px) { .hero-cat-float { width: 110px; height: 110px; right: -10px; } }

  .section-label { display: flex; align-items: center; gap: 8px; padding: 24px 20px 10px; font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  @media (max-width: 760px) { .section-label { padding: 18px 12px 8px; } }
  .section-label .cat-paw { width: 16px; height: 16px; font-size: 10px; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 20px 4px; }
  @media (max-width: 760px) { .stats-grid { padding: 0 12px; gap: 6px; } }
  @media (max-width: 760px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: linear-gradient(135deg, #f8f7ff 0%, #f0f4ff 100%); border: 1px solid #e8e4f0; border-radius: 16px; padding: 16px 14px; box-shadow: 0 2px 12px rgba(100,100,180,0.06); transition: all 0.18s; position: relative; overflow: hidden; }
  .stat-card:active { transform: scale(0.98); box-shadow: 0 4px 16px rgba(100,100,180,0.12); }
  .stat-card .ic { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 10px; overflow: hidden; }
  .stat-card .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1; }
  @media (max-width: 760px) { .stat-card .v { font-size: 20px; } .stat-card .l { font-size: 11px; } .stat-card .mini-cat { display: none; } }
  .stat-card .l { font-size: 12px; color: var(--text-dim); margin-top: 6px; font-weight: 500; }

  .stat-card.s1 .ic { background: var(--success-soft); } .stat-card.s1 .v { color: var(--success); }
  .stat-card.s2 .ic { background: var(--warning-soft); } .stat-card.s2 .v { color: var(--warning); }
  .stat-card.s3 .ic { background: var(--primary-soft); } .stat-card.s3 .v { color: var(--primary-dark); }
  .stat-card.s4 .ic { background: var(--purple-soft); } .stat-card.s4 .v { color: var(--purple); }
  .stat-card.s5 .ic { background: var(--cream-soft); } .stat-card.s5 .v { color: var(--orange); }
  .stat-card.s6 .ic { background: var(--pink-soft); } .stat-card.s6 .v { color: var(--pink); }
  .stat-card.s7 .ic { background: var(--cyan-soft); } .stat-card.s7 .v { color: var(--cyan); }
  .stat-card.s8 .ic { background: var(--danger-soft); } .stat-card.s8 .v { color: var(--danger); }

  main { padding: 0 20px 140px; max-width: 1000px; margin: 0 auto; }
  @media (max-width: 760px) { main { padding: 0 12px 140px; } }

  .modules-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 20px 10px; }
  @media (max-width: 760px) { .modules-grid { padding: 0 12px; gap: 8px; } .module-card { padding: 14px 12px 12px; min-height: 100px; } .module-name { font-size: 14px; } .module-desc { font-size: 11px; } .module-icon-wrap { width: 36px; height: 36px; margin-bottom: 10px; } .module-icon-wrap .cat-img { width: 32px; height: 32px; } }
  @media (min-width: 760px) { .modules-grid { grid-template-columns: repeat(3, 1fr); } }
  .module-card { background: linear-gradient(135deg, #f8f7ff 0%, #f0f4ff 100%); border: 1px solid #e8e4f0; border-radius: 16px; padding: 18px 14px 14px; cursor: pointer; position: relative; overflow: hidden; transition: all 0.2s; box-shadow: 0 2px 12px rgba(100,100,180,0.06); min-height: 110px; }
  .module-card:active { transform: scale(0.98); box-shadow: 0 4px 16px rgba(100,100,180,0.12); }
  .module-card:hover { transform: translateY(-2px); }
  .module-icon-wrap { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px; overflow: hidden; }
  .module-card.m1 .module-icon-wrap { background: var(--primary-soft); }
  .module-card.m2 .module-icon-wrap { background: var(--purple-soft); }
  .module-card.m3 .module-icon-wrap { background: var(--cyan-soft); }
  .module-card.m4 .module-icon-wrap { background: var(--pink-soft); }
  .module-card.m5 .module-icon-wrap { background: var(--orange-soft); }
  .module-card.m6 .module-icon-wrap { background: var(--success-soft); }
  .module-card.m7 .module-icon-wrap { background: var(--cream-soft); }
  .module-card.m8 .module-icon-wrap { background: var(--danger-soft); }
  .module-card.m9 .module-icon-wrap { background: var(--warning-soft); }
  .module-name { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
  .module-desc { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
  .module-badge { position: absolute; top: 14px; right: 14px; background: var(--primary); color: white; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; min-width: 18px; text-align: center; }
  .module-card .corner-cat { position: absolute; right: -10px; bottom: -12px; width: 60px; height: 60px; opacity: 0.18; }

  .section-title { display: flex; align-items: center; justify-content: space-between; padding: 26px 0 14px; }
  .section-title::before { content: ''; width: 4px; height: 18px; border-radius: 2px; background: #6b5ce7; margin-right: 10px; }
  .section-title h2 { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
  .section-title .more { font-size: 13px; color: #6b5ce7; cursor: pointer; font-weight: 600; }

  .card {
    background: linear-gradient(135deg, #f8f7ff 0%, #f0f4ff 100%);
    border: 1px solid #e8e4f0; border-radius: 16px; padding: 18px 16px 14px;
    margin-bottom: 10px; box-shadow: 0 2px 12px rgba(100,100,180,0.06);
    transition: all 0.18s; position: relative; overflow: hidden;
  }
  .card:active { transform: scale(0.99); box-shadow: 0 4px 16px rgba(100,100,180,0.12); }
  .card .card-title { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; line-height: 1.3; }
  .card .card-meta { font-size: 12px; color: #b0a8b8; margin-top: 5px; font-style: italic; }
  .card .card-def { font-size: 13px; font-weight: 600; color: #6b5ce7; margin-top: 6px; line-height: 1.4; }
  .card .card-action {
    position: absolute; right: 14px; top: 14px;
    font-size: 11px; color: #c4bcd0; font-weight: 600;
    padding: 4px 10px; border-radius: 12px;
    background: rgba(255,255,255,0.7); border: 1px solid #e8e4f0;
    cursor: pointer;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .col { display: flex; flex-direction: column; gap: 6px; }

  .tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .tag-primary { background: #ede9fe; color: #6b5ce7; }
  .tag-success { background: #dcfce7; color: #16a34a; }
  .tag-warning { background: #fef3c7; color: #d97706; }
  .tag-danger { background: #fee2e2; color: #ef4444; }
  .tag-purple { background: var(--purple-soft); color: var(--purple); }
  .tag-cyan { background: var(--cyan-soft); color: var(--cyan); }
  .tag-pink { background: var(--pink-soft); color: var(--pink); }
  .tag-orange { background: var(--orange-soft); color: var(--orange); }
  .tag-cream { background: var(--cream-soft); color: var(--orange); }

  .empty { text-align: center; padding: 44px 20px; color: var(--text-dim); }
  .empty .cat-big { width: 140px; height: 140px; margin: 0 auto 16px; opacity: 0.9; }
  .empty h3 { font-size: 17px; color: var(--text-soft); margin-bottom: 6px; }
  .empty p { font-size: 13px; line-height: 1.5; }
  .empty .cat-hint { margin-top: 14px; padding: 8px 16px; border-radius: 20px; background: var(--bg-soft); display: inline-block; font-size: 12px; color: var(--primary-dark); }

  .fab { position: fixed; right: 22px; bottom: calc(22px + var(--safe-bottom)); width: 60px; height: 60px; border-radius: 50% 50% 45% 45%; background: linear-gradient(135deg, var(--primary), var(--pink)); color: white; border: none; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(232,138,106,0.45); cursor: pointer; z-index: 60; transition: transform 0.2s; }
  .fab::before { content: ''; position: absolute; top: 8px; left: 12px; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); }
  .fab::after { content: ''; position: absolute; top: 8px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); }
  .fab.open { transform: rotate(45deg); }
  .fab:active { transform: scale(0.92); }
  .fab-menu { position: fixed; right: 22px; bottom: calc(92px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 10px; align-items: flex-end; opacity: 0; pointer-events: none; transform: translateY(10px) scale(0.95); transition: all 0.22s; z-index: 59; }
  .fab-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
  .fab-menu-item { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); padding: 10px 14px; border-radius: 24px; box-shadow: var(--shadow); font-size: 13px; font-weight: 600; color: var(--text-soft); cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .fab-menu-item:active { transform: scale(0.96); }
  .fab-menu-item .ic { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; }

  .modal { position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-end; justify-content: center; background: rgba(46,42,40,0.35); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-panel { width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: var(--radius) var(--radius) 0 0; padding: 22px 20px calc(28px + var(--safe-bottom)); transform: translateY(30px); transition: transform 0.28s cubic-bezier(0.32,0.72,0,1); }
  .modal.open .modal-panel { transform: translateY(0); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-head h2 { font-size: 18px; font-weight: 800; }
  .modal-close { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); cursor: pointer; color: var(--text-soft); }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); font-size: 15px; color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .form-group textarea { min-height: 90px; resize: vertical; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 13px 16px; border-radius: 14px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
  .btn-ghost { background: var(--bg-soft); color: var(--text-soft); }
  .btn-ghost:active { background: var(--border); transform: scale(0.98); }

// ---- 飞书同步（前端） ----
function getSyncBase() { return localStorage.getItem('workbench_sync_url') || ''; }
function showSyncMenu() {
  const ov = document.getElementById('syncOverlay');
  document.getElementById('syncBaseInput').value = getSyncBase();
  document.getElementById('syncStatus').textContent = '';
  ov.style.display = 'flex';
}
function closeSyncMenu() { document.getElementById('syncOverlay').style.display = 'none'; }
function saveSyncBase() {
  const v = document.getElementById('syncBaseInput').value.trim().replace(/\/$/, '');
  localStorage.setItem('workbench_sync_url', v);
  const st = document.getElementById('syncStatus');
  st.textContent = '✅ 地址已保存';
  if (v) setTimeout(closeSyncMenu, 600);
}
function syncReq(method, body) {
  const base = getSyncBase();
  if (!base) { alert('请先填写同步服务器地址'); showSyncMenu(); return null; }
  return fetch(base.replace(/\/$/, '') + '/api/sync', {
    method, headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  }).then(r => r.json()).catch(e => ({ ok: false, msg: '网络错误: ' + e.message }));
}
function syncPush() {
  const st = document.getElementById('syncStatus');
  st.textContent = '上传中...';
  syncReq('POST', { data: JSON.stringify(data) }).then(res => {
    if (res && res.ok) { st.textContent = '✅ ' + (res.msg || '已同步'); showToast('已同步到飞书喵~'); }
    else { st.textContent = '❌ ' + (res ? res.msg : '同步失败'); }
  });
}
function syncPull() {
  const st = document.getElementById('syncStatus');
  st.textContent = '拉取中...';
  syncReq('GET').then(res => {
    if (!res || !res.ok) { st.textContent = '❌ ' + (res ? res.msg : '拉取失败'); return; }
    if (!res.data) { st.textContent = '飞书暂无备份'; return; }
    if (!confirm('从飞书拉取将覆盖本地当前数据，确定继续？')) { st.textContent = '已取消'; return; }
    try {
      const incoming = JSON.parse(res.data);
      data = Object.assign({}, DEFAULT_DATA, incoming);
      ['subjects','accounts','projects','todos','materials','topics','reports','diet','stocks','schedules'].forEach(k => {
        if (!Array.isArray(data[k])) data[k] = DEFAULT_DATA[k];

let LIVE_NEWS = { tech: null, stock: null, _loading: false };
function fetchHackerNews(query, n) {
  return fetch('https://hn.algolia.com/api/v1/search_by_date?query=' + encodeURIComponent(query) + '&tags=story&hitsPerPage=' + n)
    .then(r => r.json())
    .then(d => (d.hits || []).filter(h => h.title).map(h => ({
      title: h.title,
      url: h.url || ('https://news.ycombinator.com/item?id=' + h.objectID),
      date: (h.created_at || '').slice(0, 10),
      source: 'Hacker News'
    })));
}
function fetchLiveNews() {
  if (LIVE_NEWS._loading) return;
  LIVE_NEWS._loading = true;
  const done = () => { LIVE_NEWS._loading = false; if (currentView === 'news' || currentView === 'stock') switchView(currentView); };
  const base = getSyncBase();
  if (base) {
    fetch(base.replace(/\/$/, '') + '/api/news', { headers: { 'Content-Type': 'application/json' } })
      .then(r => r.json()).then(res => {
        if (res && res.ok) {
          if (res.tech && res.tech.length) LIVE_NEWS.tech = res.tech;
          if (res.stock && res.stock.length) LIVE_NEWS.stock = res.stock;
        }
      }).catch(() => {}).finally(done);
  } else {
    Promise.all([fetchHackerNews('AI', 6), fetchHackerNews('stock market Nvidia earnings', 5)])
      .then(([tech, stock]) => {
        if (tech.length) LIVE_NEWS.tech = tech;
        if (stock.length) LIVE_NEWS.stock = stock;
      }).catch(() => {}).finally(done);
  }
}

function uploadDesktopIcon() {
  const file = document.getElementById('desktopIconFile').files[0];
  if (!file) return;
  const msg = document.getElementById('iconUploadMsg');
  msg.textContent = '处理中...';
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const c = document.createElement('canvas');
      c.width = 180; c.height = 180;
      const ctx = c.getContext('2d');
      const s = Math.min(img.width, img.height);
      const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      ctx.drawImage(img, sx, sy, s, s, 0, 0, 180, 180);
      const b64 = c.toDataURL('image/png');
      fetch('/upload-icon', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({image: b64})
      }).then(r=>r.json()).then(d=>{
        msg.innerHTML = '<span style="color:'+(d.ok?'var(--success)':'var(--danger)')+'">'+d.msg+'</span>';
        if(d.ok) showToast('桌面图标已更新！删旧图标重新添加~');
      }).catch(()=>{
        msg.innerHTML = '<span style="color:var(--danger)">上传失败，请重试</span>';
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderTodoItem(todo) {
  const p = getProject(todo.projectId);
  return `
    <div class="list-item" onclick="toggleTodo('${todo.id}', event)">
      <span class="list-action" onclick="event.stopPropagation();toggleTodo('${todo.id}')">${todo.done?'恢复':'完成'}</span>
      <div class="checkbox ${todo.done?'checked':''}" id="cb-${todo.id}">${todo.done?'✓':''}</div>
      <div class="content">
        <div class="title" style="${todo.done?'text-decoration:line-through;color:var(--text-dim)':''}">${escapeHtml(todo.title)}</div>
        <div class="meta">${todo.time||'全天'} · ${p.name||'无项目'}</div>
        <div class="def"><span class="tag tag-${todo.priority==='high'?'danger':todo.priority==='medium'?'warning':'success'}">${priorityLabel(todo.priority)}</span></div>
      </div>
    </div>
  `;
}
function priorityLabel(p) { return p==='high'?'高优先级':p==='medium'?'中优先级':'低优先级'; }
function toggleTodo(id, ev) {
  if(ev) ev.stopPropagation();
  const t = data.todos.find(x=>x.id===id);
  if(t){ t.done = !t.done; save(); switchView('todo'); showToast(t.done?'完成啦，小猫给你点赞！':'任务恢复，继续加油~'); }
}

function extractUrl(text) {
  if (!text) return '';
  const s = String(text).trim();
  const clean = (u) => u.replace(/[.,。，;；)\]】]+$/, '');
  const m1 = s.match(/https?:\/\/[^\s"'<>]+/i);
  if (m1) return clean(m1[0]);
  const known = ['v.douyin.com','b23.tv','xhslink.com','xhs.cn','t.cn','t.co','youtu.be','bit.ly','tinyurl.com','goo.gl','is.gd','qr.cx','lnk.to','xiaohongshu.com','douyin.com','bilibili.com','zhihu.com','weibo.com','weixin.qq.com','mp.weixin.qq.com','ixigua.com','youtube.com','instagram.com','taobao.com','tmall.com','x.com','twitter.com','kuaishou.com'];
  const low = s.toLowerCase();
  for (const dom of known) {
    const i = low.indexOf(dom);
    if (i >= 0) {
      let u = s.slice(i);
      const stop = u.search(/[\s"'<>]/);
      if (stop > 0) u = u.slice(0, stop);
      return 'https://' + clean(u);
    }
  }
  const m3 = s.match(/[a-z0-9-]{2,}\.[a-z]{2,}(?:\/[^\s"'<>]*)?/i);
  if (m3) {
    const u = clean(m3[0]);
    if (u.length >= 6) return 'https://' + u;
  }
  return '';
}
function openExtUrl(raw) {
  // 先识别/抽取真正的链接（短链、分享文案里夹的链接都能救）
  let url = extractUrl(raw) || (raw||'').trim();
  if (!url) return showToast('没有可打开的链接');
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  // iPhone 上打开 https 链接会经系统「通用链接」自动跳进对应 App（小红书/抖音/B站…）并定位到具体页面
  if (data.materialNewTab) {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
  } else {
    location.href = url;
  }
}
function openExtUrlFromEl(el) { openExtUrl(el.getAttribute('data-url')); }

let pomoTimer=null,pomoRunning=false,pomoSeconds=25*60,pomoIsWork=true;
function pomoTick(){
  if(pomoSeconds<=0){
    if(pomoIsWork){pomoSeconds=5*60;pomoIsWork=false;document.getElementById('pomoLabel').textContent='休息中 🐾';showToast('番茄完成！休息5分钟');}
    else{pomoSeconds=25*60;pomoIsWork=true;document.getElementById('pomoLabel').textContent='专注中 🍅';data.pomoTotal=(data.pomoTotal||0)+1;save();switchView('pomo');return;}
  }
  const m=Math.floor(pomoSeconds/60),s=pomoSeconds%60;
  document.getElementById('pomoDisplay').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  document.getElementById('pomoBar').style.width=((pomoIsWork?25*60:5*60-pomoSeconds)/(pomoIsWork?25*60:5*60)*100)+'%';
  pomoSeconds--;
}
function pomoStart(){if(!pomoRunning){pomoRunning=true;pomoTimer=setInterval(pomoTick,1000);document.getElementById('pomoStart').style.display='none';document.getElementById('pomoPause').style.display='';document.getElementById('pomoLabel').textContent='专注中 🍅';}}
function pomoPause(){pomoRunning=false;clearInterval(pomoTimer);document.getElementById('pomoStart').style.display='';document.getElementById('pomoPause').style.display='none';document.getElementById('pomoLabel').textContent='已暂停';}
function pomoReset(){pomoRunning=false;clearInterval(pomoTimer);pomoSeconds=25*60;pomoIsWork=true;document.getElementById('pomoDisplay').textContent='25:00';document.getElementById('pomoBar').style.width='0%';document.getElementById('pomoLabel').textContent='准备开始';document.getElementById('pomoStart').style.display='';document.getElementById('pomoPause').style.display='none';}

function renderScheduleView() {
  const today = todayStr();
  if (!calView) calView = today.slice(0,7);
  if (!calSel) calSel = today;
  const [yy, mm] = calView.split('-').map(Number);
  const first = new Date(yy, mm-1, 1);
  const startW = first.getDay();                 // 0=周日
  const daysInMonth = new Date(yy, mm, 0).getDate();
  const monthName = `${yy}年${mm}月`;

  // 按日期归集日程
  const byDate = {};
  (data.schedules||[]).forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });

  const totalCells = Math.ceil((startW + daysInMonth) / 7) * 7;
  const cells = [];
  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startW + 1;
    if (dayNum < 1 || dayNum > daysInMonth) { cells.push('<div class="cal-cell cal-empty"></div>'); continue; }
    const ds = `${yy}-${String(mm).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    const items = (byDate[ds]||[]).slice().sort((a,b) => (a.start||'').localeCompare(b.start||''));
    const isToday = ds === today, isSel = ds === calSel;
    const dots = items.slice(0,3).map(s => `<div class="cal-evt" onclick="event.stopPropagation();openModal('schedule','${s.id}')"><span class="cal-evt-t">${s.start||''}</span><span class="cal-evt-x">${escapeHtml(s.title)}</span></div>`).join('');
    const more = items.length > 3 ? `<div class="cal-more">+${items.length-3}</div>` : '';
    cells.push(`<div class="cal-cell${isToday?' cal-today':''}${isSel?' cal-sel':''}" onclick="calSelect('${ds}')">
      <div class="cal-daynum">${dayNum}</div>
      <div class="cal-evts">${dots}${more}</div>
    </div>`);
  }

  const selItems = (byDate[calSel]||[]).slice().sort((a,b) => (a.start||'').localeCompare(b.start||''));
  const selList = selItems.length ? selItems.map(s => `
      <div class="list-item" onclick="openModal('schedule','${s.id}')">
        <span class="list-action" onclick="event.stopPropagation();openModal('schedule','${s.id}')">编辑</span>
        <div class="icon-box" style="background:var(--purple-soft);font-size:18px;">📅</div>
        <div class="content">
          <div class="title">${escapeHtml(s.title)}</div>
          <div class="meta">${s.start||'--'} → ${s.end||'--'}</div>
          <div class="def">${escapeHtml(s.note||'')}</div>
        </div>
      </div>`).join('')
    : '<div class="empty" style="padding:24px 0;"><span style="font-size:48px;">🐈</span><p>这一天还没有安排</p></div>';

  return `
    <div class="view-head">
      <img src="cats/c11.png" style="width:60px;height:60px;object-fit:contain;">
      <div class="text"><h2>日程日历</h2><p>点日期看安排，点 ‹ › 翻月份</p></div>
    </div>
    <div class="cal-wrap">
      <div class="cal-bar">
        <button class="cal-nav" onclick="calShift(-1)">‹</button>
        <div class="cal-title">${monthName}</div>
        <button class="cal-nav" onclick="calShift(1)">›</button>
        <button class="cal-today-btn" onclick="calGoToday()">今天</button>
        <button class="btn btn-primary cal-add-btn" onclick="openModal('schedule','')">+ 新建</button>
      </div>
      <div class="cal-grid cal-weekdays">
        ${['日','一','二','三','四','五','六'].map(w => `<div class="cal-wd">${w}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells.join('')}</div>
    </div>
    <div class="cal-sel-head" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span>${fmtDate(calSel)}${calSel===today?' · 今天':''} · 共 ${selItems.length} 项</span>
      ${selItems.length ? `<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;" onclick="clearDaySchedules('${calSel}')">清空这一天</button>` : ''}
    </div>
    <button class="btn btn-primary" style="width:100%;margin:8px 0 14px;" onclick="openModal('schedule','')">+ 在 ${fmtDate(calSel)} 添加日程</button>
    ${selList}
  `;
}
function calShift(delta) {
  if (!calView) calView = todayStr().slice(0,7);
  let [y, m] = calView.split('-').map(Number);
  m += delta;
  if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
  calView = `${y}-${String(m).padStart(2,'0')}`;
  switchView('schedule');
}
function calGoToday() {
  calView = todayStr().slice(0,7);
  calSel = todayStr();
  switchView('schedule');
}
function calSelect(ds) {
  calSel = ds;
  switchView('schedule');
}
function clearDaySchedules(ds) {
  const n = (data.schedules||[]).filter(x => x.date === ds).length;
  if (!n) return showToast('这一天本来就没有安排');
  if (!confirm(`确定清空 ${fmtDate(ds)} 的全部 ${n} 项日程吗？`)) return;
  data.schedules = (data.schedules||[]).filter(x => x.date !== ds);
  save();
  showToast('已清空喵~');
  switchView('schedule');
}

}

function getTodayNews() {
  const today = new Date();
  const seed = today.getFullYear() * 10000 + (today.getMonth()+1) * 100 + today.getDate();
  const indices = [];
  while (indices.length < 5) {
    const idx = (seed + indices.length * 7) % NEWS_DATA.length;
    if (!indices.includes(idx)) indices.push(idx);
  }
  return indices.map(i => NEWS_DATA[i]);
}

function materialToTopic(matId) {
  const m = getMaterial(matId);
  if (!m.id) { showToast('素材不存在喵'); return; }
  const title = (m.title||'').toLowerCase();
  let matched = AI_TEMPLATES[Math.floor(Math.random() * AI_TEMPLATES.length)];
  for (const tpl of AI_TEMPLATES) {
    for (const kw of tpl.keywords) {
      if (title.includes(kw.toLowerCase())) { matched = tpl; break; }
    }
  }
  const newTopic = {
    id: uid(),
    projectId: m.projectId || '',
    title: '选题：' + m.title,
    sourceMaterialId: matId,
    template: matched.name,
    angle: matched.outline,
    status: 'idea',
    created: todayStr()
  };
  if (!data.topics) data.topics = [];
  data.topics.push(newTopic);
  save();
  showToast('已从素材生成选题！模板：' + matched.name);
  switchView('topic');
}

function generateTodayReport() {
  const t = todayStr();
  const todos = data.todos || [];
  const mats = data.materials || [];
  const topics = data.topics || [];
  const todayTodos = todos.filter(x => x.date === t);
  const doneTodos = todayTodos.filter(x => x.done);
  const undoneTodos = todayTodos.filter(x => !x.done);
  const todayMats = mats.filter(m => m.created === t);
  const todayTopics = topics.filter(tp => tp.created === t);
  let content = '';
  content += '【今日完成任务】\\n';
  content += doneTodos.length ? doneTodos.map(x => '• ' + x.title).join('\\n') : '今日无完成任务';
  content += '\\n\\n【未完成事项】\\n';
  content += undoneTodos.length ? undoneTodos.map(x => '• ' + x.title).join('\\n') : '今日事项全部完成';
  content += '\\n\\n【新增素材】\\n';
  content += todayMats.length ? todayMats.map(m => '• ' + m.title).join('\\n') : '今日无新增素材';
  content += '\\n\\n【新增选题】\\n';
  content += todayTopics.length ? todayTopics.map(tp => '• ' + tp.title).join('\\n') : '今日无新增选题';
  content += '\\n\\n【明日计划】\\n';
  content += undoneTodos.length ? undoneTodos.map(x => '• 推进 ' + x.title).join('\\n') : '继续推进各项目内容产出';
  const report = {
    id: uid(),
    date: t,
    content: content,
    metrics: { views: 0, likes: 0, comments: 0 }
  };
  if (!data.reports) data.reports = [];
  data.reports.push(report);
  save();
  showToast('日报已生成喵~ 可继续编辑补充');
  switchView('report');
}

      <div class="form-group" id="bloggerNameWrap" style="display:${m.type==='blogger'?'block':'none'};"><label>博主名称</label><input name="bloggerName" value="${m.type==='blogger'?escapeHtml(m.title||''):''}" placeholder="自动识别，可手动修改"></div>
      <div class="form-group"><label>标签（逗号分隔）</label><input name="tags" id="fTags" value="${(m.tags||[]).join(',')}" placeholder="自动填充" onfocus="autoDetectPlatform()"></div>
      <div class="form-group"><label>关联项目</label><select name="projectId">
        <option value="">自动匹配</option>
        ${projects.map(p=>`<option value="${p.id}" ${m.projectId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
      </select></div>

function detectPlatform(url) {
  if (!url) return '';
  const u = url.toLowerCase();
  if (u.includes('xiaohongshu.com')||u.includes('xhslink.com')) return '小红书';
  if (u.includes('douyin.com')||u.includes('tiktok.com')) return '抖音';
  if (u.includes('bilibili.com')||u.includes('b23.tv')) return 'B站';
  if (u.includes('zhihu.com')) return '知乎';
  if (u.includes('mp.weixin')||u.includes('weixin.qq.com')) return '公众号';
  if (u.includes('youtube.com')||u.includes('youtu.be')) return 'YouTube';
  if (u.includes('weibo.com')) return '微博';
  if (u.includes('x.com')||u.includes('twitter.com')) return 'X/Twitter';
  return url.match(/^(https?:\/\/)?[\w.-]+\.\w+/)?.[0] || '';
}
function onMaterialTypeChange() {
  const sel = document.querySelector('[name="mtype"]');
  const ta = document.querySelector('[name="content"]');
  const lab = document.getElementById('contentLabel');
  const nameWrap = document.getElementById('bloggerNameWrap');
  if (!sel || !ta) return;
  const t = sel.value;
  if (t === 'blogger') { ta.placeholder = '粘贴博主主页链接（小红书/B站/抖音/微博/X 等）'; if (lab) lab.textContent = '🐱 博主主页链接'; if (nameWrap) nameWrap.style.display = 'block'; }
  else if (t === 'link') { ta.placeholder = '粘贴小红书/抖音/B站/公众号等链接...'; if (lab) lab.textContent = '🔗 粘贴链接'; if (nameWrap) nameWrap.style.display = 'none'; }
  else { ta.placeholder = '写点灵感、文案片段、关键词...'; if (lab) lab.textContent = '📝 写点什么'; if (nameWrap) nameWrap.style.display = 'none'; }
  autoDetectPlatform();
}
function extractBloggerName(url, pf) {
  try {
    const u = new URL(url);
    const segs = u.pathname.split('/').filter(Boolean);
    const skip = ['user','profile','share','space','home','u','users','member'];
    let name = '';
    if (segs.length) {
      name = segs[segs.length - 1];
      if (skip.includes(name.toLowerCase()) && segs.length > 1) name = segs[segs.length - 2];
    }
    if (!name || /^\d+$/.test(name)) name = u.hostname.replace('www.','').split('.')[0];
    name = decodeURIComponent(name).replace(/[-_]/g,' ');
    return name.slice(0, 30) || '';
  } catch(e) { return ''; }
}
function autoDetectPlatform() {
  const ta = document.querySelector('[name="content"]');
  if (!ta) return;
  const url = ta.value.trim();
  const pf = detectPlatform(url);
  const el = document.getElementById('autoDetectResult');
  if (!el) return;
  const sel = document.querySelector('[name="mtype"]');
  const isBlogger = sel && sel.value === 'blogger';
  if (pf) {
    el.style.display = 'block';
    if (isBlogger) {
      const bn = extractBloggerName(url, pf);
      el.textContent = '🔍 识别到 ' + pf + ' 博主：' + (bn || '未知') + ' — 已自动填入名称';
      const nameInput = document.querySelector('[name="bloggerName"]');
      if (nameInput && !nameInput.value && bn) nameInput.value = bn;
    } else {
      el.textContent = '🔍 检测到：' + pf + ' — 已自动匹配对应赛道';
    }
  } else {
    el.style.display = 'none';
  }
}
function saveMaterial(e, editId) {
  const fd = new FormData(e.target);
  const tags = (fd.get('tags')||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  const rawContent = (fd.get('content')||'').trim();
  const mtype = fd.get('mtype') || (extractUrl(rawContent) ? 'link' : 'text');
  let title = '', type = mtype, platform = '', content;
  if (mtype === 'text') {
    content = rawContent;
  } else {
    content = extractUrl(rawContent) || rawContent; // 智能抽取真正的链接（也兼容短链）
  }
  if (mtype === 'blogger') {
    platform = detectPlatform(content);
    title = (fd.get('bloggerName')||'').trim() || extractBloggerName(content, platform) || (platform ? platform + ' 博主' : '未命名博主');
  } else if (mtype === 'link') {
    try { title = (platform = detectPlatform(content)) ? platform + ' · ' + (new URL(content).pathname.split('/').filter(Boolean).pop()?.replace(/[-_]/g,' ')?.slice(0,50) || new URL(content).hostname.replace('www.','')) : content.slice(0,40); }
    catch(e) { title = content.slice(0,40); }
  } else {
    title = content.split('\\n')[0]?.slice(0,40) || content.slice(0,30);
  }
  const obj = { title, type, platform, content, projectId: fd.get('projectId'), tags, note: fd.get('note') };
  if (editId) { const m = data.materials.find(x=>x.id===editId); if(m) Object.assign(m, obj); }
  else { data.materials.push({ id: uid(), ...obj, created: todayStr() }); }
  save(); closeModal(); switchView('material'); showToast(mtype==='blogger' ? '博主已收藏喵~' : '素材已保存喵~');
}

function doSearch() {
  const q = searchQuery.toLowerCase();
  const container = document.getElementById('searchResults');
  if (!q) { container.innerHTML = ''; return; }
  let results = [];
  (data.projects||[]).forEach(p => { if (p.name.toLowerCase().includes(q) || (p.goal||'').toLowerCase().includes(q)) results.push({ type: '项目', id: p.id, title: p.name, view: 'project' }); });
  (data.materials||[]).forEach(m => { if (m.title.toLowerCase().includes(q) || (m.content||'').toLowerCase().includes(q)) results.push({ type: '素材', id: m.id, title: m.title, view: 'material' }); });
  (data.topics||[]).forEach(tp => { if (tp.title.toLowerCase().includes(q) || (tp.angle||'').toLowerCase().includes(q)) results.push({ type: '选题', id: tp.id, title: tp.title, view: 'topic' }); });
  (data.todos||[]).forEach(t => { if (t.title.toLowerCase().includes(q)) results.push({ type: '任务', id: t.id, title: t.title, view: 'todo' }); });
  if (!results.length) { container.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;">没找到相关结果喵~</div>'; return; }
  container.innerHTML = results.slice(0, 20).map(r => `
    <div class="list-item" onclick="closeModal();switchView('${r.view}','${r.id}')">
      <div class="icon-box" style="background:var(--primary-soft);"><span style="font-size:20px;">✅</span></div>
      <div class="content">
        <div class="title">${escapeHtml(r.title)}</div>
        <div class="meta">${r.type}</div>
      </div>
    </div>
  `).join('');
}

}
